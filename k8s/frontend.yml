apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ssl
  labels:
    app: frontend
    tier: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: DOCKER_USER/ssl-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: CONFIG_SERVICE_URL
          value: "http://config-service:8005"
        
        # 🔴 TRƯỜNG HỢP 1: NẾU ĐI QUA API GATEWAY (CỔNG NỘI BỘ 8088 & NODEPORT 30888)
        - name: INTERNAL_AUTH_API_URL
          value: "http://api-gateway:8088/api/v1"
        - name: INTERNAL_EXAM_API_URL
          value: "http://api-gateway:8088/api/v1"
        - name: NEXT_PUBLIC_AUTH_API_URL
          value: "http://localhost:30888/api/v1"
        - name: NEXT_PUBLIC_EXAM_API_URL
          value: "http://localhost:30888/api/v1"

        # 🔴 TRƯỜNG HỢP 2: NẾU GỌI TRỰC TIẾP TỚI TỪNG SERVICE (BỎ COMMENT NẾU KHÔNG DÙNG GATEWAY)
        # - name: INTERNAL_AUTH_API_URL
        #   value: "http://auth-service:8000/api/v1"
        # - name: INTERNAL_EXAM_API_URL
        #   value: "http://exam-service:8001/api/v1"
        # - name: NEXT_PUBLIC_AUTH_API_URL
        #   value: "http://localhost:31000/api/v1"
        # - name: NEXT_PUBLIC_EXAM_API_URL
        #   value: "http://localhost:31001/api/v1"

        envFrom:
        - configMapRef:
            name: frontend-config
            optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ssl
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 31080
  selector:
    app: frontend