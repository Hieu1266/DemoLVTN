name: Build & Deploy (k8s)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Tên image khớp với k8s/*.yml hiện tại (auth_service dùng gạch dưới, các cái còn lại gạch ngang)
  REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: auth
            image: auth_service
            context: backend/services/auth
          - name: exam
            image: exam-service
            context: backend/services/exam
          - name: frontend
            image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        env:
          NEXT_PUBLIC_AUTH_API_URL: ${{ vars.NEXT_PUBLIC_AUTH_API_URL }}
          NEXT_PUBLIC_EXAM_API_URL: ${{ vars.NEXT_PUBLIC_EXAM_API_URL }}
        run: |
          IMAGE="${REGISTRY_USER}/${{ matrix.image }}"
          ARGS=()
          # NEXT_PUBLIC_* được nhúng lúc build nên phải truyền bằng build-arg
          if [ "${{ matrix.name }}" = "frontend" ]; then
            ARGS+=(--build-arg "NEXT_PUBLIC_AUTH_API_URL=${NEXT_PUBLIC_AUTH_API_URL}")
            ARGS+=(--build-arg "NEXT_PUBLIC_EXAM_API_URL=${NEXT_PUBLIC_EXAM_API_URL}")
          fi
          docker build "${ARGS[@]}" -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" "${{ matrix.context }}"

      - name: Push image
        run: |
          IMAGE="${REGISTRY_USER}/${{ matrix.image }}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Chỉ cần khi runner KHÔNG nằm cùng máy/cluster với kubectl đã cấu hình sẵn
      - name: Setup kubeconfig (optional)
        if: ${{ secrets.KUBE_CONFIG != '' }}
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Render manifests (image user + tag theo commit)
        run: |
          sed -i "s#DOCKER_USER/#${{ secrets.DOCKER_USERNAME }}/#g; s#:latest#:${GITHUB_SHA}#g" \
            k8s/backend.yml k8s/frontend.yml

      - name: Create/Update backend-secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET_KEY: ${{ secrets.CLIENT_SECRET_KEY }}
          FRONTEND_HOST: ${{ vars.FRONTEND_HOST }}
          BACKEND_USER_URL: ${{ vars.BACKEND_USER_URL }}
        run: |
          # URL-encode mật khẩu để không vỡ connection string khi có ký tự đặc biệt
          ENC_PW=$(python3 -c "import os,urllib.parse as u;print(u.quote(os.environ['DB_PASSWORD'],safe=''))")
          kubectl create secret generic backend-secrets \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --from-literal=CLIENT_ID="$CLIENT_ID" \
            --from-literal=CLIENT_SECRET_KEY="$CLIENT_SECRET_KEY" \
            --from-literal=FRONTEND_HOST="$FRONTEND_HOST" \
            --from-literal=BACKEND_USER_URL="$BACKEND_USER_URL" \
            --from-literal=USERS_DB_URL="postgresql://${DB_USER}:${ENC_PW}@postgres:5432/users_ssl_db" \
            --from-literal=EXAM_DB_URL="postgresql://${DB_USER}:${ENC_PW}@postgres:5432/exams_ssl_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Postgres
        run: |
          kubectl apply -f k8s/postgres.yml
          kubectl rollout status statefulset/postgres --timeout=180s

      - name: Ensure databases exist (idempotent)
        run: |
          for db in users_ssl_db exams_ssl_db; do
            kubectl exec postgres-0 -- sh -c \
              "psql -U \"$DB_USER\" -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='$db'\" | grep -q 1 \
               || psql -U \"$DB_USER\" -d postgres -c 'CREATE DATABASE $db'"
          done

      - name: Deploy services
        run: |
          kubectl apply -f k8s/backend.yml
          kubectl apply -f k8s/frontend.yml
          kubectl apply -f k8s/auto-scaling.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-service --timeout=180s
          kubectl rollout status deployment/exam-service --timeout=180s
          kubectl rollout status deployment/frontend --timeout=240s